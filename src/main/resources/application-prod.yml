spring:
  datasource:
    url: jdbc:postgresql://prod-db-host:5432/gymcrm_prod
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10

hibernate:
  hbm2ddl:
    auto: validate
  show_sql: false

management:
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    io.github.mrergos.gymcrm: WARN