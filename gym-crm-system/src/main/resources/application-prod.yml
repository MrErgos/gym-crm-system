spring:
  datasource:
    url: jdbc:postgresql://prod-db-host:5432/gymcrm_prod
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
  artemis:
    mode: native
    broker-url: ${ARTEMIS_BROKER_URL}
    user: ${ARTEMIS_USER}
    password: ${ARTEMIS_PASSWORD}

hibernate:
  hbm2ddl:
    auto: validate
  show_sql: false

security:
  jwt:
    # No default here on purpose: startup must fail fast if the secret
    # was not provided in the production environment.
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    io.github.mrergos.gymcrm: WARN

jms:
  queues:
    workload-events: prod.workload.events
    workload-events-invalid: prod.workload.events.invalid.dlq
    workload-request: prod.workload.summary.request
    workload-reply-prefix: prod.workload.summary.reply
  reply-timeout-ms: ${WORKLOAD_REPLY_TIMEOUT_MS:5000}