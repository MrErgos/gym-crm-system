spring:
  application:
    name: gym-crm-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
  artemis:
    mode: native
    broker-url: ${ARTEMIS_BROKER_URL:tcp://localhost:61616}
    user: ${ARTEMIS_USER:artemis}
    password: ${ARTEMIS_PASSWORD:artemis}
  jms:
    template:
      delivery-mode: persistent
  jackson:
    deserialization:
      fail-on-unknown-properties: false

hibernate:
  show_sql: false
  format_sql: false
  current_session_context_class: org.springframework.orm.hibernate5.SpringSessionContext

security:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-value-in-production!}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 hour
  brute-force:
    max-attempts: ${BRUTE_FORCE_MAX_ATTEMPTS:3}
    lockout-minutes: ${BRUTE_FORCE_LOCKOUT_MINUTES:5}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    io.github.mrergos.gymcrm: INFO

jms:
  queues:
    workload-events: workload.events
    workload-events-invalid: workload.events.invalid.dlq
    workload-request: workload.summary.request
    workload-reply-prefix: workload.summary.reply
  reply-timeout-ms: ${WORKLOAD_REPLY_TIMEOUT_MS:5000}