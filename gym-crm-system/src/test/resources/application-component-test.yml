spring:
  application:
    name: gym-crm-system-component-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  cloud:
    discovery:
      enabled: false
    eureka:
      client:
        enabled: false
        register-with-eureka: false

  jms:
    listener:
      auto-startup: false
  sql:
    init:
      data-locations: classpath:data.sql

hibernate:
  hbm2ddl:
    auto: create-drop
  show_sql: false

security:
  jwt:
    secret: test-secret-key-minimum-256-bits-long-for-jjwt-library-validation
    expiration-ms: 3600000

jms:
  queues:
    workload-events: test.workload.events
    workload-events-invalid: test.workload.events.invalid.dlq
    workload-request: test.workload.summary.request
    workload-reply-prefix: test.workload.summary.reply
  reply-timeout-ms: 1000