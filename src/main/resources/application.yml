spring:
  application:
    name: gym-crm-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

hibernate:
  show_sql: false
  format_sql: false
  current_session_context_class: org.springframework.orm.hibernate5.SpringSessionContext

security:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-value-in-production!}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 hour
  brute-force:
    max-attempts: ${BRUTE_FORCE_MAX_ATTEMPTS:3}
    lockout-minutes: ${BRUTE_FORCE_LOCKOUT_MINUTES:5}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    io.github.mrergos.gymcrm: INFO
