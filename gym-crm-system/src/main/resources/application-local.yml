spring:
  datasource:
    url: jdbc:h2:file:./data/gymcrm;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  artemis:
    mode: native
    broker-url: ${ARTEMIS_BROKER_URL:tcp://localhost:61616}
    user: ${ARTEMIS_USER:artemis}
    password: ${ARTEMIS_PASSWORD:artemis}
#  sql:
#    init:
#      data-locations: classpath:data-local.sql

hibernate:
  hbm2ddl:
    auto: update
  show_sql: false
  format_sql: true

jms:
  queues:
    workload-events: local.workload.events
    workload-events-invalid: local.workload.events.invalid.dlq
    workload-request: local.workload.summary.request
    workload-reply-prefix: local.workload.summary.reply
  reply-timeout-ms: ${WORKLOAD_REPLY_TIMEOUT_MS:5000}
#  listener:
#    concurrency: 3-10
logging:
  level:
    io.github.mrergos.gymcrm: DEBUG