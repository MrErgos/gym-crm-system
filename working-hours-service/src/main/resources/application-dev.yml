spring:
  mongodb:
    uri: ${MONGO_URI:mongodb://dev_db_host:27017/workinghours_dev}
  jpa:
    hibernate:
      ddl-auto: update
  artemis:
    mode: native
    broker-url: ${ARTEMIS_BROKER_URL:tcp://dev-artemis-host:61616}
    user: ${ARTEMIS_USER:artemis}
    password: ${ARTEMIS_PASSWORD}

jms:
  queues:
    workload-events: dev.workload.events
    workload-events-invalid: dev.workload.events.invalid.dlq
    workload-request: dev.workload.summary.request
  listener:
    concurrency: "5-20"