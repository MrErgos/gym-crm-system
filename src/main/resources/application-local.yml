spring:
  datasource:
    url: jdbc:h2:file:./data/gymcrm;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  sql:
    init:
      data-locations: classpath:data-local.sql

hibernate:
  hbm2ddl:
    auto: update
  show_sql: true
  format_sql: true

logging:
  level:
    io.github.mrergos.gymcrm: DEBUG