server:
  port: 8082

spring:
  application:
    name: working-hours-service

  datasource:
    url: jdbc:h2:mem:workingHoursDb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  artemis:
    mode: native
    broker-url: ${ARTEMIS_BROKER_URL:tcp://localhost:61616}
    user: ${ARTEMIS_USER:artemis}
    password: ${ARTEMIS_PASSWORD:artemis}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Must match security.jwt.secret in gym-crm-system: this service only validates the signature/expiry of service-to-service tokens issued
# by the Main Microservice, it does not issue tokens of its own.
security:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-value-in-production!}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{transactionId}] %-5level %logger{36} - %msg%n"
  level:
    io.github.mrergos.workinghours: DEBUG
    web: debug

jms:
  queues:
    workload-events: workload.events
    workload-events-invalid: workload.events.invalid.dlq
    workload-request: workload.summary.request
  listener:
    concurrency: "3-10"



