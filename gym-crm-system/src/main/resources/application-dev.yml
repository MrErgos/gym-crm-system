spring:
  datasource:
    url: jdbc:postgresql://dev-db-host:5432/gymcrm_dev
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  artemis:
    mode: native
    broker-url: ${ARTEMIS_BROKER_URL:tcp://dev-artemis-host:61616}
    user: ${ARTEMIS_USER:artemis}
    password: ${ARTEMIS_PASSWORD}

hibernate:
  hbm2ddl:
    auto: update
  show_sql: false

jms:
  queues:
    workload-events: dev.workload.events
    workload-events-invalid: dev.workload.events.invalid.dlq
    workload-request: dev.workload.summary.request
    workload-reply-prefix: dev.workload.summary.reply
  reply-timeout-ms: ${WORKLOAD_REPLY_TIMEOUT_MS:5000}